<!DOCTYPE html>
<html>
<head>
<title>Municipality Letter</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

:root{
  --primary-color:red;
  --secondary-color:#455A64;
  --border-color:black;
  --table-header-bg:#F0F0F0;
  --background-color:#F1F1F1;
  --font-size-base:14px;
  --font-size-small:10px;
  --font-size-print:11px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-size:var(--font-size-base);
}

body{
  font-family:sans-serif;
  padding-left:200px;
  padding-right:200px;
}

/* HEADER */

.municipality_section{
  padding-bottom:10px;
  border-bottom:2px solid red;
}

.contain{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding-top:30px;
}

.municipality_logo{
  position:absolute;
  left:0;
}

.municipality_logo img{
  width:80px;
}

.municipality_info{
  text-align:center;
  color:var(--primary-color);
  line-height:1.4;
}

.municipality_info h2{
  font-size:18px;
  font-weight:bold;
}

.municipality_info h3{
  font-size:15px;
}

.municipality_info h4{
  font-size:13px;
}

/* SERIAL SECTION */

.serial_number{
  color:var(--primary-color);
  padding-top:15px;
  display:flex;
  justify-content:space-between;
  font-size:13px;
}

/* ---------------------- */
/* TABLET RESPONSIVE */
/* ---------------------- */

@media (max-width:1024px){

body{
  padding-left:80px;
  padding-right:80px;
}

.municipality_logo img{
  width:65px;
}

.municipality_info h2{
  font-size:16px;
}

}

/* ---------------------- */
/* MOBILE RESPONSIVE */
/* ---------------------- */

@media (max-width:600px){

body{
  padding-left:20px;
  padding-right:20px;
}

.contain{
  flex-direction:column;
  gap:10px;
}

.municipality_logo{
  position:static;
}

.municipality_logo img{
  width:60px;
}

.municipality_info{
  line-height:1.3;
}

.municipality_info h2{
  font-size:15px;
}

.municipality_info h3{
  font-size:13px;
}

.municipality_info h4{
  font-size:12px;
}

.serial_number{
  flex-direction:column;
  gap:5px;
}

}

/* ---------------------- */
/* PRINT */
/* ---------------------- */

@media print{

body{
  padding-left:50px;
  padding-right:50px;
  font-size:var(--font-size-print);
}

}

</style>

</head>


<body>

<div class="municipality_section">

  <div class="contain">

    <div class="municipality_logo">
      <img src="https://imgs.search.brave.com/2I_X7CU0qLXLO6tvSzwrpsShsdmltUWWtkYvX2E9Frg/rs:fit:700:586:1/g:ce/aHR0cHM6Ly9sb2dv/cy1kb3dubG9hZC5j/b20vd3AtY29udGVu/dC91cGxvYWRzLzIw/MjEvMDcvRW1ibGVt/X29mX05lcGFsLTcw/MHg1ODYucG5n" alt="logo">
    </div>

    <div class="municipality_info">
      <h3>##WARD_NUMBER_HEADER## नं. वडा कार्यालय</h3>
      <h2>##MUNICIPALITY_NAME_HEADER##</h2>
      <h4>##WARD_ADDRESS_HEADER##</h4>
      <h4>##DISTRICT_HEADER##, ##PROVINCE_HEADER##</h4>
    </div>

  </div>

  <div class="serial_number">
    <div>
      <div>पत्र संख्या : ##COUNT2##</div>
      <div>चलानी नं. : ##DISPATCH_NO##</div>
    </div>

    <div>
      मिति : ##C_DATE##
    </div>
  </div>

</div>

</body>
</html>
